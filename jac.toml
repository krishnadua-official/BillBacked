[project]
name = "billbacked"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[byllm.model]
default_model = "${LLM_MODEL:-gemini/gemini-3.5-flash-lite}"
api_key = "${GOOGLE_API_KEY:-}"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "blue"
font = "geist"
radius = "small"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
pandas = ">=2.0.0"
pymupdf = "~=1.28"
pdfplumber = "~=0.11"
pytesseract = "~=0.3"
Pillow = "~=12.3"
litellm = "~=1.83"
[dependencies.npm]
"@fontsource-variable/geist" = "*"
"@hugeicons/core-free-icons" = "latest"
"@hugeicons/react" = "latest"
"@radix-ui/react-slot" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@base-ui/react" = "*"
"@hookform/resolvers" = "^5.2.2"
"@tanstack/react-form" = "^1.33.0"
cmdk = "*"
embla-carousel-react = "*"
input-otp = "*"
react = "^18.2.0"
react-day-picker = "*"
react-dom = "^18.2.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
react-resizable-panels = "*"
react-router-dom = "^6.22.0"
recharts = "*"
sonner = "*"
vaul = "*"
zod = "^4.3.6"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "BillBacked — Medicare Bill Audits"
description = "Audit Medicare bills, understand the true cost, and prepare a provider negotiation."
keywords = "Medicare, medical bills, bill audit, healthcare"
author = "BillBacked"
theme_color = "#171717"
icon = "/assets/brand/favicon.ico"
og_type = "website"
og_title = "BillBacked"
og_description = "Understand what your Medicare bill should cost."
og_site_name = "BillBacked"

[scale.microservices]
enabled = false

[scale.jwt]
secret = "${JAC_JWT_SECRET:-billbacked-dev-secret-change-before-deploy}"

[serve]
base_route_app = "app"

[jacpack]
name = "BillBacked"
description = "Jac IDE snapshot for BillBacked"
