[project]
name = "fullstack-auth"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[byllm]
[byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"
api_key = "${OPENAI_API_KEY:-}"


[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "amber"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies]
[dependencies.npm]
"@hugeicons/core-free-icons" = "latest"
"@hugeicons/react" = "latest"
"@radix-ui/react-slot" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@base-ui/react" = "*"
"@hookform/resolvers" = "^5.2.2"
"@tanstack/react-form" = "^1.33.0"
cmdk = "*"
embla-carousel-react = "*"
input-otp = "*"
react = "^18.2.0"
react-day-picker = "*"
react-dom = "^18.2.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
react-resizable-panels = "*"
react-router-dom = "^6.22.0"
recharts = "*"
sonner = "*"
vaul = "*"
zod = "^4.3.6"


[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "Notebook"
description = "Sign up, write notes, sign out. Every note lives on your own graph, persisted with zero setup, and nobody else can read it."
keywords = "notes, auth, fullstack, graph, jac"
author = "Notebook"
theme_color = "#dc7702"
og_type = "website"
og_title = "Notebook"
og_description = "A full-stack notes app with auth and zero-setup persistence -- no database to configure."
og_site_name = "Notebook"


[scale]
[scale.microservices]
enabled = false

[scale.jwt]
secret = "${JAC_JWT_SECRET:-notebook-dev-secret-change-before-deploy}"


[serve]
base_route_app = "app"

[jacpack]
name = 'BillBacked'
description = 'Jac IDE snapshot for BillBacked'
